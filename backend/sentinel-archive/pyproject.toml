[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sturdy-potato"
version = "0.1.0"
description = "Local Sentinel-2 historical archive and agricultural indices"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "numpy>=2,<3",
    "rasterio>=1.4,<2",
    "shapely>=2,<3",
    "keyring>=25,<26",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
sentinel-archive = "sentinel_archive.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

