name: agmeo

services:
  postgres:
    # Multi-arch PostGIS build; the official postgis/postgis image has no arm64 variant.
    image: imresamu/postgis:18-3.6
    environment:
      POSTGRES_DB: agmeo
      POSTGRES_USER: agmeo_owner
      POSTGRES_PASSWORD: agmeo_owner
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/docker/init-roles.sql:/docker-entrypoint-initdb.d/10-init-roles.sql:ro
      - ./db/docker/init-keycloak.sql:/docker-entrypoint-initdb.d/20-init-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agmeo_owner -d agmeo"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.12-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  # Local mail catcher: SMTP on :1025, web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "1025:1025"
      - "8025:8025"

  # Identity provider (OIDC). Admin console http://localhost:8180/admin (admin / admin).
  # The realm "agmeo" with the web client and the demo users is imported on first start.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8180:8180"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro

  # One-shot migration runner, identical to what CI/CD should run.
  migrate:
    image: migrate/migrate:v4.19.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://agmeo_owner:agmeo_owner@postgres:5432/agmeo?sslmode=disable
      - up

volumes:
  postgres-data:
  nats-data:
