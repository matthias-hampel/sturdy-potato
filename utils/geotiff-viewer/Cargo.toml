[package]
name = "geotiff-viewer"
version = "0.1.0"
edition = "2024"
description = "Native GPUI viewer for multiband scientific GeoTIFFs"
publish = false

[dependencies]
anyhow = "1"
gpui-kit = "=0.7.3"
image = { version = "0.25", default-features = false, features = ["png"] }
roxmltree = "0.21"
serde_json = "1"
tiff = "=0.11.3"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

